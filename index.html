<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="HEVCA Photo & Art – Fotografía profesional en México. Sesiones corporativas, comerciales, boudoir, eventos y newborn." />
    <meta name="keywords" content="fotografía profesional, sesiones corporativas, fotografía comercial, boudoir, eventos, newborn, México" />
    <meta name="author" content="HEVCA Photo & Art" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />
    <meta property="og:title" content="HEVCA Photo & Art" />
    <meta property="og:description" content="HEVCA Photo & Art – Fotografía profesional en México. Sesiones corporativas, comerciales, boudoir, eventos y newborn." />
    <meta property="og:image" content="/Canon_SL2_png/Frames_000.png" />
    <meta property="og:url" content="https://hevca-vue-app.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HEVCA Photo & Art" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:instagram:hevca_photoart" content="hevca_photo_art" />
    <meta property="og:tiktok:grettelheviac" content="hevca_photo_art" />

    <!-- LCP hint alternativo: el mismo frame en formato WebP (mejor compresión, pero no soportado en Safari) -->
    <link rel="preload" href="/Canon_SL2_webp/Frames_000.webp" as="image" type="image/webp" fetchpriority="high">
    
  
    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="HEVCA" />
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <!-- Resource hints: preconnect a dominios críticos -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.sanity.io" crossorigin />

    <!-- Fuente Google Fonts — carga NO bloqueante (print/onload trick) -->
    <!-- Se aplica al renderizar con display=swap, sin bloquear el FCP -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,900;1,400&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,900;1,400&display=swap" />
    </noscript>


    <title>HEVCA Photo & Art</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
